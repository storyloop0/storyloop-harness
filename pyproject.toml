[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "storyloop-harness"
version = "0.2.0"
description = "Interactive narrative runtime with a deterministic event store boundary"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = ["pydantic>=2,<3", "agentscope==2.0.9"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
evaluation = ["langfuse==4.17.0"]

[project.scripts]
storyloop-harness-demo = 'storyloop_harness.demo:main'

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
storyloop_harness = ['demo_scenario/*.json']
